name: Build Android eBPF

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'reF1nd 分支'
        type: choice
        options:
          - reF1nd-testing
          - reF1nd-testing-next
          - reF1nd-stable
          - reF1nd-stable-next
        default: reF1nd-testing

permissions:
  contents: read

# 与上游 reF1nd/sing-box 的 .github/workflows/android-ebpf.yml 保持一致：
# Go 版本 / NDK / 构建 tag 都直接读上游文件，不再在此处写死。
# 唯一区别是 Build 前加了依赖下载重试 + 多源 GOPROXY + 模块缓存，
# 用来绕开 Go module proxy 偶发的 stream error: stream ID N; INTERNAL_ERROR。

jobs:
  build:
    name: Build (${{ matrix.target.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - goarch: arm64
            compiler: aarch64-linux-android35-clang
          - goarch: arm
            goarm: "7"
            compiler: armv7a-linux-androideabi35-clang
          - goarch: amd64
            compiler: x86_64-linux-android35-clang
          - goarch: "386"
            compiler: i686-linux-android35-clang
    steps:
      - name: Checkout reF1nd/sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.ref || 'reF1nd-testing' }}
          fetch-depth: 0

      - name: Read build parameters
        id: cfg
        run: |
          set -euo pipefail
          f=.github/workflows/android-ebpf.yml
          get() { grep -m1 -- "$1" "$f" | sed "s/.*$1 *//" | tr -d '"' | xargs; }
          # 只接受"值形状"正确的匹配行，避免 grep -m1 命中的是别的上下文
          TAGS="$(get 'BASE_TAGS:')"
          [[ "$TAGS" == *with_* ]] || TAGS=""
          GOV="$(get 'go-version:')"
          [[ "$GOV" =~ ^[0-9]+\.[0-9]+ ]] || GOV=""
          NDK="$(get 'ndk-version:')"
          [[ "$NDK" =~ ^r[0-9]+$ ]] || NDK=""
          [ -n "$TAGS" ] || TAGS="with_quic,with_dhcp,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0"
          [ -n "$GOV" ]  || GOV="1.26.8"
          [ -n "$NDK" ]  || NDK="r29"
          {
            echo "tags=$TAGS"
            echo "go=$GOV"
            echo "ndk=$NDK"
          } >> "$GITHUB_OUTPUT"
          echo "TAGS=$TAGS  GO=$GOV  NDK=$NDK"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.cfg.outputs.go }}

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'reF1nd-testing' }}"

          BASE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ "$BASE" != *-reF1nd* ]]; then
            if [[ "$REF" == *testing* ]]; then
              FAMILY='^v[0-9.]+-(alpha|beta|rc)[0-9.]*-reF1nd$'
            else
              FAMILY='^v[0-9.]+-reF1nd$'
            fi
            FALLBACK="$(git tag --sort=-v:refname | grep -E "$FAMILY" | head -1 || true)"
            echo "::warning::tip 上没有 reF1nd 标签（describe=$BASE），回退到 $FALLBACK"
            BASE="${FALLBACK:-$BASE}"
          fi

          BASE="${BASE#v}"
          BASE="${BASE%%-reF1nd*}"
          [ -n "$BASE" ] || BASE="0.0.0"
          VERSION="${BASE}-$(git rev-parse --short HEAD)"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "nearest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          echo "reF1nd commit: $(git rev-parse HEAD)"
          echo "VERSION=$VERSION"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.cfg.outputs.ndk }}

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.compiler }}
          # 多源顺序回退，官方源挂了自动切镜像
          GOPROXY: https://proxy.golang.org,https://goproxy.cn,https://goproxy.io,direct
        run: |
          export TAGS="${{ steps.cfg.outputs.tags }}"

          # 先单独拉依赖并重试：Go 抓 module zip 不续传，HTTP/2 流一断就整次构建失败
          for i in 1 2 3 4 5; do
            echo "==> go mod download ($i/5, GOPROXY=$GOPROXY)"
            if go mod download all; then
              echo "==> 依赖就绪"
              break
            fi
            [ "$i" = 5 ] && { echo "::error::依赖下载 5 次均失败"; exit 1; }
            sleep 10
          done

          make build VERSION="$VERSION"
          ./sing-box version | head -2

      # 只缓存 Go 模块目录；不缓存 ~/.cache/go-build（体积大、跨 runner tar 易炸）
      # 模块目录已存在（命中）时不清空也不覆盖，避免 tar 报 "Cannot open: File exists"
      - name: Cache Go modules
        if: always()
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ steps.cfg.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ steps.cfg.outputs.go }}-${{ hashFiles('go.sum') }}
            gomod-${{ runner.os }}-${{ steps.cfg.outputs.go }}-

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-android-${{ matrix.target.goarch }}-with-ebpf-${{ steps.ver.outputs.version }}
          path: sing-box
          retention-days: 7
          if-no-files-found: error
