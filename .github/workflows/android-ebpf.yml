name: Build Android arm64

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'reF1nd 分支'
        type: choice
        options:
          - reF1nd-testing-next
          - reF1nd-testing
          - reF1nd-stable-next
          - reF1nd-stable
        default: reF1nd-testing-next

permissions:
  contents: write

concurrency:
  group: android-build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (android/arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reF1nd/sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.ref || 'reF1nd-testing-next' }}
          fetch-depth: 0

      - name: Read build parameters
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/android-ebpf.yml
          get() { [ -f "$f" ] && grep -m1 -- "$1" "$f" | sed "s/.*$1 *//" | tr -d '"*[:space:]' || true; }
          TAGS="$(get 'BASE_TAGS:')"
          [[ "$TAGS" == *with_* ]] || TAGS="with_quic,with_dhcp,with_utls,with_clash_api,with_ebpf,badlinkname,tfogo_checklinkname0"
          GOV="$(get 'go-version:')"
          [[ "$GOV" =~ ^[0-9]+\.[0-9]+ ]] || GOV="1.26.8"
          NDK="$(get 'ndk-version:')"
          [[ "$NDK" =~ ^r[0-9]+$ ]] || NDK="r29"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "go=$GOV" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "TAGS=$TAGS GO=$GOV NDK=$NDK"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.cfg.outputs.go }}
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.cfg.outputs.ndk }}

      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'reF1nd-testing-next' }}"
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ "$BASE" != *-reF1nd* ]]; then
            if [[ "$REF" == *testing* ]]; then
              FAMILY='^v[0-9.]+-(alpha|beta|rc)[0-9.]*-reF1nd$'
            else
              FAMILY='^v[0-9.]+-reF1nd$'
            fi
            FALLBACK="$(git tag --sort=-v:refname | grep -E "$FAMILY" | head -1 || true)"
            echo "::warning::tip 上没有 reF1nd 标签（describe=$BASE），回退到 ${FALLBACK:-无}"
            BASE="${FALLBACK:-$BASE}"
          fi
          BASE="${BASE#v}"
          BASE="${BASE%%-reF1nd*}"
          [ -n "$BASE" ] || BASE="0.0.0"
          VERSION="${BASE}-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION  HEAD=$(git rev-parse HEAD)"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          GOPROXY: https://proxy.golang.org,https://goproxy.cn,https://goproxy.io,direct
        run: |
          set -euo pipefail
          export TAGS="${{ steps.cfg.outputs.tags }}"
          for i in 1 2 3 4 5; do
            echo "==> go mod download ($i/5)"
            if go mod download; then break; fi
            [ "$i" = 5 ] && { echo "::error::依赖下载 5 次均失败"; exit 1; }
            sleep 10
          done
          make build VERSION="$VERSION"
          ls -lh sing-box
          sha256sum sing-box | tee sing-box.sha256

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          file sing-box
          readelf -h sing-box | grep -E 'Class|Machine'
          go version -m sing-box | grep -E 'vcs.revision|-tags' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64-${{ env.VERSION }}
          path: |
            sing-box
            sing-box.sha256
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-arm64-${{ inputs.ref }}-${{ env.VERSION }}
          name: android/arm64 ${{ inputs.ref }} ${{ env.VERSION }}
          files: |
            sing-box
            sing-box.sha256
          make_latest: false
